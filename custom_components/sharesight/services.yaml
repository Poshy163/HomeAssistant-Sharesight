get_portfolio_summary:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sharesight
    device_id:
      required: false
      selector:
        device:
          integration: sharesight

get_holdings:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sharesight
    device_id:
      required: false
      selector:
        device:
          integration: sharesight
    sort_by:
      required: false
      default: value
      selector:
        select:
          options:
            - value
            - capital_gain
            - capital_gain_percent
            - symbol
    limit:
      required: false
      selector:
        number:
          min: 1
          max: 500
          mode: box

get_income:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sharesight
    device_id:
      required: false
      selector:
        device:
          integration: sharesight

export_raw_snapshot:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sharesight
    device_id:
      required: false
      selector:
        device:
          integration: sharesight

generate_performance_report:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sharesight
    device_id:
      required: false
      selector:
        device:
          integration: sharesight
    start_date:
      required: true
      example: "2024-07-01"
      selector:
        text:
    end_date:
      required: true
      example: "2025-06-30"
      selector:
        text:
    grouping:
      required: false
      selector:
        text:
    consolidated:
      required: false
      selector:
        boolean:
    include_sales:
      required: false
      selector:
        boolean:

get_instrument_fundamentals:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sharesight
    device_id:
      required: false
      selector:
        device:
          integration: sharesight
    symbol:
      required: true
      example: AAPL
      selector:
        text:

get_login_link:
  fields:
    config_entry_id:
      required: false
      selector:
