[pytest]
testpaths = tests
norecursedirs = .git .ruff_cache __pycache__ diagnostics
# pytest-asyncio (pulled in by pytest-homeassistant-custom-component) needs
# auto mode so the async integration tests under tests/ha/ are collected
# without a per-test marker.  It is reported as an unknown option when the
# plugin is not loaded, which is harmless.
asyncio_mode = auto
addopts = --strict-markers
filterwarnings =
    # datetime.strptime("%m-%d") without a year is deprecated in 3.13+ and
    # becomes an error in 3.15; the integration must not reintroduce it (see
    # dates.parse_financial_year_end and tests/test_dates.py).
    error::DeprecationWarning:custom_components.sharesight.*
