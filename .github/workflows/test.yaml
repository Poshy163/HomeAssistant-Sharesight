name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2026.7.4"
            plugin: "0.13.348"
          - ha: "2026.9.1"
            plugin: "0.13.364"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # pytest-homeassistant-custom-component pins the Home Assistant it
          # was built against, and current Home Assistant requires 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        env:
          HA_TEST_PLUGIN: ${{ matrix.plugin }}
        run: |
          python -m pip install --upgrade pip
          sed "s/^pytest-homeassistant-custom-component==.*/pytest-homeassistant-custom-component==$HA_TEST_PLUGIN/" requirements_test.txt > /tmp/requirements-sharesight.txt
          python -m pip install -r /tmp/requirements-sharesight.txt
          python -m pip check

      - name: Run the test suite
        # The whole suite, including tests/ha/, which need the Home Assistant
        # plugin and therefore only run on Linux.
        run: >-
          python -m pytest -q
          --cov=custom_components.sharesight
          --cov-report=term-missing
          --cov-fail-under=70

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check --output-format=github
      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check
