name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # pytest-homeassistant-custom-component pins the Home Assistant it
          # was built against, and current Home Assistant requires 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Run the test suite
        # The whole suite, including tests/ha/, which need the Home Assistant
        # plugin and therefore only run on Linux.
        run: >-
          python -m pytest -q
          --cov=custom_components.sharesight
          --cov-report=term-missing
          --cov-fail-under=30

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check
